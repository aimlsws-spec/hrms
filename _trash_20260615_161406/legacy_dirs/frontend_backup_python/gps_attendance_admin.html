<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Attendance Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #333; margin-bottom: 30px; }
        .section { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { color: #667eea; font-size: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        button { background: #667eea; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button:hover { background: #5568d3; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #333; font-weight: 600; }
        .valid { color: #10b981; }
        .invalid { color: #ef4444; }
        .success { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
        .error { background: #fee; color: #c00; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 GPS Attendance Management</h1>

        <!-- Add Location Section -->
        <div class="section">
            <h2>Add Office Location</h2>
            <div id="addMessage"></div>
            <div class="form-group">
                <label>Location Name</label>
                <input type="text" id="locationName" placeholder="e.g., Head Office">
            </div>
            <div class="form-group">
                <label>Latitude</label>
                <input type="number" step="0.000001" id="latitude" placeholder="e.g., 28.6139">
            </div>
            <div class="form-group">
                <label>Longitude</label>
                <input type="number" step="0.000001" id="longitude" placeholder="e.g., 77.2090">
            </div>
            <div class="form-group">
                <label>Radius (meters)</label>
                <input type="number" id="radius" value="100" placeholder="e.g., 100">
            </div>
            <button onclick="addLocation()">Add Location</button>
        </div>

        <!-- Locations List -->
        <div class="section">
            <h2>Office Locations</h2>
            <div id="locationsList">Loading...</div>
        </div>

        <!-- Attendance Records -->
        <div class="section">
            <h2>Recent Attendance Records</h2>
            <div id="attendanceRecords">Loading...</div>
        </div>
    </div>

    <script>
        async function addLocation() {
            const data = {
                location_name: document.getElementById('locationName').value,
                latitude: parseFloat(document.getElementById('latitude').value),
                longitude: parseFloat(document.getElementById('longitude').value),
                radius_meters: parseInt(document.getElementById('radius').value)
            };

            try {
                const response = await fetch('http://localhost:8002/api/gps-attendance/locations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (result.success) {
                    showMessage('addMessage', '✅ Location added successfully', 'success');
                    document.getElementById('locationName').value = '';
                    document.getElementById('latitude').value = '';
                    document.getElementById('longitude').value = '';
                    loadLocations();
                } else {
                    showMessage('addMessage', '❌ Failed to add location', 'error');
                }
            } catch (error) {
                showMessage('addMessage', '❌ Error: ' + error.message, 'error');
            }
        }

        async function loadLocations() {
            try {
                const response = await fetch('http://localhost:8002/api/gps-attendance/locations');
                const data = await response.json();

                if (data.success && data.locations.length > 0) {
                    document.getElementById('locationsList').innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Location Name</th>
                                    <th>Latitude</th>
                                    <th>Longitude</th>
                                    <th>Radius (m)</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.locations.map(loc => `
                                    <tr>
                                        <td>${loc.location_name}</td>
                                        <td>${loc.latitude}</td>
                                        <td>${loc.longitude}</td>
                                        <td>${loc.radius_meters}</td>
                                        <td>${loc.is_active ? '✅ Active' : '❌ Inactive'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    document.getElementById('locationsList').innerHTML = '<p>No locations added yet</p>';
                }
            } catch (error) {
                document.getElementById('locationsList').innerHTML = '<p class="error">Failed to load locations</p>';
            }
        }

        async function loadAttendance() {
            try {
                // For demo, load records for emp004
                const response = await fetch('http://localhost:8002/api/gps-attendance/history/emp004');
                const data = await response.json();

                if (data.success && data.records.length > 0) {
                    document.getElementById('attendanceRecords').innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Employee</th>
                                    <th>Type</th>
                                    <th>Time</th>
                                    <th>Location</th>
                                    <th>Distance</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.records.slice(0, 10).map(record => `
                                    <tr>
                                        <td>${record.employee_id}</td>
                                        <td>${record.punch_type === 'IN' ? '🟢 IN' : '🔴 OUT'}</td>
                                        <td>${new Date(record.punch_time).toLocaleString()}</td>
                                        <td>${record.location_name || 'Unknown'}</td>
                                        <td>${record.distance_meters}m</td>
                                        <td class="${record.is_valid ? 'valid' : 'invalid'}">
                                            ${record.is_valid ? '✅ Valid' : '❌ Invalid'}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    document.getElementById('attendanceRecords').innerHTML = '<p>No attendance records yet</p>';
                }
            } catch (error) {
                document.getElementById('attendanceRecords').innerHTML = '<p class="error">Failed to load records</p>';
            }
        }

        function showMessage(elementId, msg, type) {
            const msgDiv = document.getElementById(elementId);
            msgDiv.className = type;
            msgDiv.textContent = msg;
            setTimeout(() => msgDiv.textContent = '', 5000);
        }

        // Initialize
        loadLocations();
        loadAttendance();
        setInterval(loadAttendance, 30000); // Refresh every 30 seconds
    </script>
</body>
</html>
