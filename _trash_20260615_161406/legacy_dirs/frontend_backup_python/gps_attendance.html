<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Attendance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #667eea; text-align: center; margin-bottom: 30px; font-size: 28px; }
        .status { background: #f0f4ff; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .location-info { font-size: 14px; color: #666; margin-top: 10px; }
        .punch-buttons { display: flex; gap: 15px; margin-bottom: 20px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .punch-in { background: #10b981; color: white; }
        .punch-in:hover { background: #059669; transform: translateY(-2px); }
        .punch-out { background: #ef4444; color: white; }
        .punch-out:hover { background: #dc2626; transform: translateY(-2px); }
        .history { margin-top: 30px; }
        .history h2 { font-size: 18px; color: #333; margin-bottom: 15px; }
        .record { background: #f9fafb; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #667eea; }
        .record.invalid { border-left-color: #ef4444; }
        .record-time { font-weight: 600; color: #333; }
        .record-details { font-size: 13px; color: #666; margin-top: 5px; }
        .loading { text-align: center; color: #667eea; padding: 20px; }
        .error { background: #fee; color: #c00; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .success { background: #d1fae5; color: #065f46; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 GPS Attendance</h1>
        
        <div class="status">
            <div id="employeeInfo">Loading...</div>
            <div class="location-info" id="locationInfo">Getting location...</div>
        </div>

        <div id="message"></div>

        <div class="punch-buttons">
            <button class="punch-in" onclick="punch('IN')">🟢 Punch IN</button>
            <button class="punch-out" onclick="punch('OUT')">🔴 Punch OUT</button>
        </div>

        <div class="history">
            <h2>Today's Records</h2>
            <div id="historyList">Loading...</div>
        </div>
    </div>

    <script>
        let currentPosition = null;
        const employeeId = localStorage.getItem('user_id') || 'emp004';

        // Get current location
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        currentPosition = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude
                        };
                        document.getElementById('locationInfo').innerHTML = 
                            `📍 Lat: ${currentPosition.latitude.toFixed(4)}, Lon: ${currentPosition.longitude.toFixed(4)}`;
                    },
                    error => {
                        document.getElementById('locationInfo').innerHTML = 
                            `❌ Location access denied. Please enable GPS.`;
                    }
                );
            }
        }

        // Punch IN/OUT
        async function punch(type) {
            if (!currentPosition) {
                showMessage('Please enable location access', 'error');
                return;
            }

            try {
                const response = await fetch('http://localhost:8002/api/gps-attendance/punch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        employee_id: employeeId,
                        punch_type: type,
                        latitude: currentPosition.latitude,
                        longitude: currentPosition.longitude,
                        device_info: navigator.userAgent
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    if (data.is_valid) {
                        showMessage(`✅ ${type} recorded successfully at ${data.location_name} (${data.distance_meters}m away)`, 'success');
                    } else {
                        showMessage(`⚠️ ${type} recorded but you're outside geofence (${data.distance_meters}m away)`, 'error');
                    }
                    loadHistory();
                } else {
                    showMessage('❌ Failed to record punch', 'error');
                }
            } catch (error) {
                showMessage('❌ Error: ' + error.message, 'error');
            }
        }

        // Load attendance history
        async function loadHistory() {
            try {
                const response = await fetch(`http://localhost:8002/api/gps-attendance/history/${employeeId}`);
                const data = await response.json();

                if (data.success && data.records.length > 0) {
                    const today = new Date().toISOString().split('T')[0];
                    const todayRecords = data.records.filter(r => r.punch_time.startsWith(today));
                    
                    document.getElementById('historyList').innerHTML = todayRecords.map(record => `
                        <div class="record ${record.is_valid ? '' : 'invalid'}">
                            <div class="record-time">
                                ${record.punch_type === 'IN' ? '🟢' : '🔴'} ${record.punch_type} - 
                                ${new Date(record.punch_time).toLocaleTimeString()}
                            </div>
                            <div class="record-details">
                                ${record.location_name || 'Unknown'} • ${record.distance_meters}m away
                                ${record.is_valid ? '✅ Valid' : '❌ Outside geofence'}
                            </div>
                        </div>
                    `).join('') || '<div class="loading">No records today</div>';
                } else {
                    document.getElementById('historyList').innerHTML = '<div class="loading">No records today</div>';
                }
            } catch (error) {
                document.getElementById('historyList').innerHTML = '<div class="error">Failed to load history</div>';
            }
        }

        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.className = type;
            msgDiv.textContent = msg;
            setTimeout(() => msgDiv.textContent = '', 5000);
        }

        // Initialize
        document.getElementById('employeeInfo').textContent = `Employee: ${employeeId}`;
        getLocation();
        loadHistory();
        setInterval(getLocation, 30000); // Update location every 30 seconds
    </script>
</body>
</html>
