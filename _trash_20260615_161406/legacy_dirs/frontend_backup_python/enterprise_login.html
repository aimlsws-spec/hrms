<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS Enterprise Portal - Login v2024-12-24</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1497366216548-37526070297c?w=1920') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(8px);
            background: rgba(102, 126, 234, 0.3);
        }
        
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }
        
        .shape:nth-child(1) { width: 80px; height: 80px; left: 10%; top: 20%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 60px; height: 60px; right: 15%; top: 40%; animation-delay: 2s; }
        .shape:nth-child(3) { width: 100px; height: 100px; left: 70%; bottom: 30%; animation-delay: 4s; }
        .shape:nth-child(4) { width: 50px; height: 50px; left: 20%; bottom: 20%; animation-delay: 6s; }
        .shape:nth-child(5) { width: 70px; height: 70px; right: 25%; top: 15%; animation-delay: 8s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }
        

        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px) saturate(180%);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 0;
            width: 900px;
            max-width: 90vw;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 600px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-left {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 40px;
            color: white;
            position: relative;
        }
        
        .login-left::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 30% 70%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .company-logo {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            z-index: 1;
        }
        
        .company-name {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            z-index: 1;
        }
        
        .company-tagline {
            font-size: 18px;
            opacity: 0.9;
            text-align: center;
            line-height: 1.6;
            z-index: 1;
        }
        
        .login-right {
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-title {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .login-subtitle {
            color: #7f8c8d;
            font-size: 16px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
            font-size: 14px;
        }
        
        .form-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }
        
        .input-icon {
            position: relative;
        }
        
        .input-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #95a5a6;
            font-size: 18px;
        }
        
        .input-icon .form-input {
            padding-left: 50px;
        }
        
        .login-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .login-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .login-button:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        
        .login-button:active {
            transform: translateY(0);
        }
        
        .shake {
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .forgot-password {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .forgot-password a:hover {
            text-decoration: underline;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: #95a5a6;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e1e8ed;
        }
        
        .divider span {
            padding: 0 20px;
            font-size: 14px;
        }
        
        .demo-credentials {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #667eea;
        }
        
        .demo-credentials h4 {
            color: #2c3e50;
            margin-bottom: 12px;
            font-size: 16px;
        }
        
        .credential-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .credential-role {
            font-weight: 600;
            color: #34495e;
        }
        
        .credential-login {
            color: #667eea;
            font-family: 'Courier New', monospace;
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #e74c3c;
            display: none;
        }
        
        .success-message {
            background: #efe;
            color: #363;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #27ae60;
            display: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
        }
        
        .loading i {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .login-container {
                grid-template-columns: 1fr;
                width: 95vw;
                max-width: 400px;
            }
            
            .login-left {
                display: none;
            }
            
            .login-right {
                padding: 40px 30px;
            }
        }
        
        .feature-list {
            list-style: none;
            margin-top: 30px;
            z-index: 1;
        }
        
        .feature-list li {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            opacity: 0.9;
        }
        
        .feature-list i {
            margin-right: 12px;
            color: #ffffff;
            font-size: 16px;
        }
    </style>
</head>
<body>
    
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    
    <div class="login-container">
        <div class="login-left">
            <div class="company-logo">
                <i class="fas fa-building"></i>
            </div>
            <div class="company-name">HRMS Enterprise</div>
            <div class="company-tagline">
                Advanced Human Resource Management System with AI-Powered Assistance
            </div>
            <ul class="feature-list">
                <li><i class="fas fa-check"></i> Employee Management</li>
                <li><i class="fas fa-check"></i> Leave Management</li>
                <li><i class="fas fa-check"></i> Document Generation</li>
                <li><i class="fas fa-check"></i> AI Assistant</li>
                <li><i class="fas fa-check"></i> Real-time Analytics</li>
            </ul>
        </div>
        
        <div class="login-right">
            <div class="login-header">
                <h1 class="login-title">Welcome Back</h1>
                <p class="login-subtitle">Sign in to access your HRMS portal</p>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            <div class="loading" id="loadingMessage">
                <i class="fas fa-spinner"></i> Authenticating...
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username or Email</label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" class="form-input" placeholder="Enter your username or email" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                    </div>
                </div>
                
                <div class="form-group" id="otpGroup" style="display: none;">
                    <label class="form-label" for="otp">Enter OTP</label>
                    <div class="input-icon">
                        <i class="fas fa-key"></i>
                        <input type="text" id="otp" class="form-input" placeholder="Enter 6-digit OTP" maxlength="6" pattern="[0-9]{6}">
                    </div>
                    <div style="margin-top: 8px; font-size: 14px; color: #667eea;">
                        <i class="fas fa-info-circle"></i> OTP: <span id="otpDisplay"></span>
                    </div>
                </div>
                
                <button type="submit" class="login-button" id="loginButton">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>


        </div>
    </div>

    <script>
        console.log('Login script loaded at:', new Date().toISOString());
        
        let otpRequired = false;
        let currentUsername = '';
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const otp = document.getElementById('otp').value;
            
            if (!otpRequired) {
                if (!username || !password) {
                    showError('Please enter both username and password');
                    return;
                }
                
                showLoading(true);
                hideMessages();
                
                try {
                    const response = await fetch('http://localhost:8002/auth/login?v=' + Date.now(), {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        showError(errorData.message || `Server error: ${response.status}`);
                document.getElementById('loginForm').classList.add('shake');
                setTimeout(() => document.getElementById('loginForm').classList.remove('shake'), 500);
                        showLoading(false);
                        return;
                    }
                    
                    const data = await response.json();
                    
                    if (data.success && data.requires_otp) {
                        otpRequired = true;
                        currentUsername = username;
                        document.getElementById('otpGroup').style.display = 'block';
                        document.getElementById('otpDisplay').textContent = data.otp || 'Check email';
                        document.getElementById('loginButton').innerHTML = '<i class="fas fa-key"></i> Verify OTP';
                        showSuccess('OTP sent! Enter the OTP below to continue.');
                    } else {
                        showError(data.message || 'Login failed. Please check your credentials.');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showError('Connection failed. Please ensure the main server is running on port 8002.');
                } finally {
                    showLoading(false);
                }
            } else {
                if (!otp) {
                    showError('Please enter the OTP');
                    return;
                }
                
                showLoading(true);
                hideMessages();
                
                try {
                    const response = await fetch('http://localhost:8002/auth/verify-otp', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username: currentUsername,
                            otp: otp
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`Server error: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        localStorage.setItem('hrms_user', JSON.stringify(data.user));
                        localStorage.setItem('hrms_token', data.token);
                        
                        console.log('Login successful, user data:', data.user);
                        
                        if (!data.user.profile_completed) {
                            showSuccess('Login successful! Please complete your profile...');
                            setTimeout(() => {
                                window.location.href = 'profile_completion.html';
                            }, 2000);
                        } else {
                            if (data.user.role === 'support') { 
                                showSuccess('Login successful! Redirecting to Support Dashboard...'); 
                                setTimeout(() => { window.location.href = '/support'; }, 1500); 
                            } else if (data.user.role === 'accountant') { 
                                showSuccess('Login successful! Redirecting to Accountant Dashboard...'); 
                                setTimeout(() => { window.location.href = '/accountant'; }, 1500); 
                            } else { 
                                showSuccess('Login successful! Redirecting to dashboard...'); 
                                setTimeout(() => { window.location.href = 'enterprise_portal.html'; }, 1500); 
                            }
                        }
                    } else {
                        showError(data.message || 'OTP verification failed.');
                    }
                } catch (error) {
                    console.error('OTP verification error:', error);
                    showError('Connection failed. Please ensure the main server is running on port 8002.');
                } finally {
                    showLoading(false);
                }
            }
        });
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
        
        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }
        
        function showLoading(show) {
            document.getElementById('loadingMessage').style.display = show ? 'block' : 'none';
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const userData = localStorage.getItem('hrms_user');
            const token = localStorage.getItem('hrms_token');
            
            if (userData && token) {
                window.location.href = 'enterprise_portal.html';
            }
        });
    </script>
</body>
</html>
